<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedVeda - Reset Password</title>
<style>
  :root {
    --brand: #2E7D32;
    --brand-dark: #1B5E20;
    --bg: #0F1712;
    --card: #16201A;
    --text: #EAF5EC;
    --subtitle: #9FB8A6;
    --error: #E5484D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  .logo { font-size: 56px; margin-bottom: 8px; }
  h1 {
    color: var(--text);
    font-size: 24px;
    margin: 0 0 8px;
  }
  p {
    color: var(--subtitle);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--brand);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 12px;
    border: none;
    cursor: pointer;
  }
  .btn:active { background: var(--brand-dark); }
  .hint {
    font-size: 13px;
    color: var(--subtitle);
    margin-top: 16px;
  }
  .error-box {
    background: rgba(229,72,77,0.12);
    border: 1px solid var(--error);
    color: #FCA5A5;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    margin-bottom: 20px;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🌿</div>
    <h1>MedVeda</h1>
    <div id="content">
      <p>Preparing your password reset link…</p>
    </div>
  </div>

<script>
(() => {
  // Capture the recovery fragment only in memory and remove it before rendering.
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  window.history.replaceState(null, "", window.location.pathname + window.location.search);
  const content = document.getElementById("content");
  const error = params.get("error_description");
  const accessToken = params.get("access_token");
  const refreshToken = params.get("refresh_token");
  const recovery = params.get("type") === "recovery" && accessToken && refreshToken;

  content.textContent = "";
  const message = document.createElement("p");
  message.className = error || !recovery ? "error-box" : "";
  message.textContent = error || (recovery
    ? "Tap below to finish resetting your password in the MedVeda app."
    : "This reset link is invalid or has expired. Please request a new one from the app.");
  content.appendChild(message);

  // Tokens never enter markup, attributes, storage or logs. Only a real tap
  // constructs the native handoff; page load never navigates automatically.
  const button = document.createElement("button");
  button.type = "button";
  button.className = "btn";
  button.textContent = "Open MedVeda App";
  button.addEventListener("click", () => {
    let appUrl = "medveda://reset-password";
    if (!error && recovery) {
      appUrl += "#access_token=" + encodeURIComponent(accessToken)
        + "&refresh_token=" + encodeURIComponent(refreshToken) + "&type=recovery";
    }
    window.location.assign(appUrl);
  });
  content.appendChild(button);
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "If the app does not open, make sure MedVeda is installed. You can request a new reset link from its Login screen.";
  content.appendChild(hint);
})();
</script>
</body>
</html>
