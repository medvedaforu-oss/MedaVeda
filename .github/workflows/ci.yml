name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tooling/package-lock.json }
      - run: npm ci --prefix tooling
      - run: npm run lint --prefix tooling

  admin-panel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin-panel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-panel/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npm test
      - run: node scripts/p1-financial-ui-selftest.cjs
      - run: npm audit --audit-level=high

  mobile-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile-app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/p2-quality-selftest.cjs && node scripts/p2-performance-selftest.cjs && node mobile-app/scripts/p2-registration-selftest.cjs && node scripts/p2-admin-labels-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/closed-testing-selftest.cjs
        working-directory: .
      - run: node --experimental-strip-types scripts/checkout-html-selftest.mjs
      - run: node --experimental-strip-types scripts/password-policy-selftest.mjs
      - run: node scripts/verify-signature-selftest.js
      - run: node scripts/same-project-build-selftest.cjs
      - run: node scripts/staging-build-selftest.cjs
      - run: node scripts/firebase-config-selftest.cjs && node scripts/push-lifecycle-selftest.cjs && node scripts/notification-routing-selftest.cjs && node scripts/notification-account-hook-selftest.cjs
      - run: node scripts/play-catalog-contract-selftest.cjs
      - run: python3 scripts/android-bundle-validator-selftest.py
      - run: node supabase/tests/p1-push-delivery-selftest.cjs && node supabase/tests/p0-notification-selftest.cjs
        working-directory: .
      - run: node scripts/payment-provider-selftest.cjs
      - run: node scripts/payment-routing-selftest.cjs
      - run: node mobile-app/scripts/release-payments-disabled-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/razorpay-internal-test-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/nonplay-test-isolation-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/purchases-unavailable-ui-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/payment-poll-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/payment-request-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/startup-availability-selftest.cjs && node mobile-app/scripts/readiness-selftest.cjs
        working-directory: .
      - run: node supabase/tests/razorpay-routing-selftest.cjs && node supabase/tests/razorpay-security-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/checkout-security-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/payment-verdict-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/payment-summary-selftest.cjs
        working-directory: .
      - run: node mobile-app/scripts/notes-billing-choice-selftest.cjs && node supabase/tests/notes-choice-order-selftest.cjs
        working-directory: .
      - run: node scripts/navigation-lazy-selftest.cjs
      - run: node scripts/offline-license-storage-selftest.cjs
      - run: node scripts/offline-download-selftest.cjs
      - run: node scripts/offline-owner-selftest.cjs
      - run: node scripts/quiz-hooks-selftest.cjs
      - run: node scripts/purchases-selftest.cjs
      - run: npm audit --omit=dev --audit-level=high

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build.mjs
      - run: node scripts/check-links.mjs

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: |
          for f in supabase/functions/*/index.ts; do deno check "$f"; done
          deno check supabase/workers/validate-note-pdf.ts
          deno test --allow-env supabase/tests/quarantine-worker-test.ts supabase/tests/upload-note-pdf-test.ts supabase/tests/play_catalog_unit_test.ts supabase/tests/play_catalog_api_test.ts

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # Node harnesses transpile real handlers with the mobile locked compiler.
      - run: npm ci --prefix mobile-app
      - name: Build a database from the migrations and run every SQL suite + the webhook harness
        run: PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=ci supabase/tests/run-all.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/secret-scan-selftest.mjs
      - name: No real keys in the repo
        run: git ls-files -z | node scripts/scan-secrets.mjs --stdin
